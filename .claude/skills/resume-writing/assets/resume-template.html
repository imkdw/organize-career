<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>이력서 - {{이름}}</title>
<style>
  :root {
    --text: #191f28;
    --text-sub: #4e5968;
    --text-muted: #8b95a1;
    --line: #e5e8eb;
    --accent: #191f28;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: "Apple SD Gothic Neo", "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    color: var(--text);
    line-height: 1.65;
    font-size: 14px;
    background: #f2f4f6;
  }
  .page {
    max-width: 820px;
    margin: 0 auto;
    background: #fff;
    padding: 64px 56px;
  }
  a { color: inherit; }

  /* 헤더 */
  header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
  header .role { font-size: 16px; color: var(--text-sub); margin-top: 4px; }
  header .contacts { margin-top: 16px; font-size: 13px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }

  /* 섹션 공통 */
  section { margin-top: 44px; }
  h2 {
    font-size: 19px; font-weight: 700; letter-spacing: -0.3px;
    padding-bottom: 10px; border-bottom: 2px solid var(--accent); margin-bottom: 20px;
  }
  h3 { font-size: 15.5px; font-weight: 700; }
  .item { margin-bottom: 26px; }
  .item:last-child { margin-bottom: 0; }
  .item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .period { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .sub { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
  ul { margin-top: 8px; padding-left: 18px; }
  li { margin-bottom: 5px; color: var(--text-sub); }
  li strong { color: var(--text); font-weight: 600; }
  .tech { margin-top: 8px; font-size: 12.5px; color: var(--text-muted); }
  .tech span {
    display: inline-block; background: #f2f4f6; border-radius: 4px;
    padding: 2px 8px; margin: 2px 4px 2px 0;
  }

  /* 직접 작성 플레이스홀더 */
  .todo {
    border: 1.5px dashed #c9cdd2; border-radius: 8px; padding: 16px;
    color: var(--text-muted); font-size: 13px;
  }

  /* 인쇄(PDF) */
  @page { size: A4; margin: 14mm 12mm; }
  @media print {
    body { background: #fff; font-size: 12.5px; }
    .page { max-width: none; padding: 0; }
    section, .item { break-inside: avoid; }
    .todo { display: none; } /* 미작성 섹션은 PDF에서 숨김 */
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>{{이름}}</h1>
    <p class="role">{{직함 - 예: 백엔드 엔지니어}}</p>
    <div class="contacts">
      <span>{{이메일}}</span>
      <span>{{GitHub URL}}</span>
      <span>{{블로그/링크드인 (선택)}}</span>
    </div>
  </header>

  <!-- MANUAL: 직접 작성 -->
  <section id="intro">
    <h2>소개</h2>
    <div class="todo">직접 작성 영역입니다. 3~5문장: 어떤 개발자인지, 강점, 지향. (작성 후 이 박스를 지우고 p 태그로 교체)</div>
  </section>

  <!-- MANUAL: 직접 작성 (회사/직무/기간 뼈대만 하네스가 채울 수 있음) -->
  <section id="experience">
    <h2>업무 경험</h2>
    <div class="item">
      <div class="item-head">
        <h3>{{회사명}}</h3>
        <span class="period">{{YYYY.MM ~ 재직중}}</span>
      </div>
      <p class="sub">{{직무/팀}}</p>
      <div class="todo">직접 작성 영역: 담당 역할 요약 1~2문장.</div>
    </div>
  </section>

  <!-- AUTO:PROJECTS - 하네스(resume-writer)가 이 섹션을 채운다 -->
  <section id="projects">
    <h2>프로젝트</h2>
    <!-- 프로젝트 item 반복 구조:
    <div class="item">
      <div class="item-head">
        <h3>{프로젝트/성과 제목}</h3>
        <span class="period">{YYYY.MM ~ YYYY.MM}</span>
      </div>
      <p class="sub">{한 줄 맥락 - 어떤 문제/배경}</p>
      <ul>
        <li>{XYZ 불릿 3~5개}</li>
      </ul>
      <p class="tech"><span>NestJS</span><span>PostgreSQL</span></p>
    </div>
    -->
  </section>
  <!-- /AUTO:PROJECTS -->

  <!-- MANUAL: 직접 작성 -->
  <section id="education">
    <h2>학력</h2>
    <div class="todo">직접 작성 영역: 학교/전공/기간.</div>
  </section>

  <!-- MANUAL: 직접 작성 -->
  <section id="certificates">
    <h2>자격증</h2>
    <div class="todo">직접 작성 영역: 자격증명/취득일. 없으면 섹션 삭제.</div>
  </section>

</div>
</body>
</html>
